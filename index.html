layout: null
---
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZIP64 Video Packer (No Size Limit)</title>
</head>
<body style="margin:0; padding:20px; background:#0b1120; color:#f8fafc; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display:flex; justify-content:center; align-items:center; min-height:90vh;">

  <div style="background:#1e293b; border:1px solid #334155; border-radius:14px; padding:24px; max-width:460px; width:100%; box-shadow:0 12px 30px rgba(0,0,0,0.5);">
    <h2 style="margin-top:0; color:#10b981; font-size:1.25rem;">ZIP64 Stream Packer</h2>
    <p style="color:#94a3b8; font-size:0.85rem; line-height:1.4;">Zero RAM bottleneck. Emits standard 64-bit ZIP files capable of packing 5GB, 10GB+, or higher without crashes.</p>

    <div style="margin:20px 0; border:2px dashed #475569; border-radius:8px; padding:28px 12px; text-align:center; background:#0f172a; cursor:pointer;" onclick="document.getElementById('fileInput').click()">
      <span id="label" style="font-size:0.92rem; font-weight:600; color:#38bdf8;">Select Video (Any Size)</span>
      <input type="file" id="fileInput" accept="video/*" style="display:none;" />
    </div>

    <div id="progWrap" style="display:none; margin-bottom:16px;">
      <div style="display:flex; justify-content:space-between; font-size:0.8rem; margin-bottom:6px; color:#cbd5e1;">
        <span id="status">Streaming...</span>
        <span id="pct">0%</span>
      </div>
      <div style="background:#334155; height:7px; border-radius:4px; overflow:hidden;">
        <div id="bar" style="background:#10b981; height:100%; width:0%; transition:width 0.1s;"></div>
      </div>
    </div>

    <button id="dlBtn" style="display:none; width:100%; padding:12px; background:#10b981; color:#022c22; border:none; border-radius:8px; font-weight:bold; font-size:0.95rem; cursor:pointer;">
      Download Scrambled .ZIP
    </button>
  </div>

  <script>
    const CHUNK_SIZE = 1024 * 1024; // 1MB chunks
    const XOR_KEY = 0xAA;

    // Fast CRC-32 Table
    const table = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      let c = i;
      for (let k = 0; k < 8; k++) c = ((c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1));
      table[i] = c;
    }
    function calcCrc(bytes) {
      let crc = 0xFFFFFFFF;
      for (let i = 0; i < bytes.length; i++) crc = table[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
      return (crc ^ 0xFFFFFFFF) >>> 0;
    }

    const fileInput = document.getElementById('fileInput');
    const label = document.getElementById('label');
    const progWrap = document.getElementById('progWrap');
    const bar = document.getElementById('bar');
    const status = document.getElementById('status');
    const pct = document.getElementById('pct');
    const dlBtn = document.getElementById('dlBtn');

    let resultBlob = null;
    let fileName = 'video';

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      fileName = file.name.replace(/\.[^/.]+$/, "");
      label.innerText = `${file.name} (${(file.size / (1024*1024*1024)).toFixed(2)} GB)`;
      progWrap.style.display = 'block';
      dlBtn.style.display = 'none';

      const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
      const chunks = [];
      const parts = [];
      const cdEntries = [];
      let currentOffset = 0n; // Use BigInt for 64-bit offsets

      for (let i = 0; i < totalChunks; i++) {
        const start = i * CHUNK_SIZE;
        const end = Math.min(start + CHUNK_SIZE, file.size);

        // Read 1MB chunk only
        const buffer = await file.slice(start, end).arrayBuffer();
        const u8 = new Uint8Array(buffer);

        // Scramble
        for (let b = 0; b < u8.length; b++) u8[b] ^= XOR_KEY;

        const name = `p_${String(i).padStart(6, '0')}.raw`;
        chunks.push(name);

        const nameBytes = new TextEncoder().encode(name);
        const crc = calcCrc(u8);
        const size = BigInt(u8.length);

        // ZIP Local Header (standard or with ZIP64 extra block if offset exceeds 4GB)
        let lh;
        const isOffset64 = currentOffset >= 0xFFFFFFFFn;
        const extraLen = isOffset64 ? 20 : 0;
        
        lh = new Uint8Array(30 + nameBytes.length + extraLen);
        const v = new DataView(lh.buffer);
        v.setUint32(0, 0x04034b50, true);
        v.setUint16(4, 45, true); // Version 4.5 for ZIP64
        v.setUint16(6, 0, true);
        v.setUint16(8, 0, true);
        v.setUint32(14, crc, true);
        v.setUint32(18, Number(size), true);
        v.setUint32(22, Number(size), true);
        v.setUint16(26, nameBytes.length, true);
        v.setUint16(28, extraLen, true);
        lh.set(nameBytes, 30);

        if (isOffset64) {
          v.setUint16(30 + nameBytes.length, 0x0001, true); // ZIP64 tag
          v.setUint16(32 + nameBytes.length, 16, true);
          v.setBigUint64(34 + nameBytes.length, size, true);
          v.setBigUint64(42 + nameBytes.length, size, true);
        }

        parts.push(lh);
        parts.push(u8);

        cdEntries.push({ nameBytes, crc, size, offset: currentOffset });
        currentOffset += BigInt(lh.length) + size;

        // Yield execution every 10 chunks so the browser Garbage Collector frees RAM
        if (i % 10 === 0 || i === totalChunks - 1) {
          const p = Math.round(((i + 1) / totalChunks) * 100);
          bar.style.width = p + '%';
          pct.innerText = p + '%';
          status.innerText = `Slicing & streaming ${i + 1} of ${totalChunks}...`;
          await new Promise(r => setTimeout(r, 0));
        }
      }

      // Metadata Manifest
      const manifest = JSON.stringify({
        name: file.name,
        mime: file.type || 'video/mp4',
        size: file.size,
        chunks: chunks
      });
      const mBytes = new TextEncoder().encode(manifest);
      const mNameBytes = new TextEncoder().encode('manifest.json');
      const mCrc = calcCrc(mBytes);
      const mSize = BigInt(mBytes.length);

      const mlh = new Uint8Array(30 + mNameBytes.length);
      const mv = new DataView(mlh.buffer);
      mv.setUint32(0, 0x04034b50, true);
      mv.setUint16(4, 45, true);
      mv.setUint32(14, mCrc, true);
      mv.setUint32(18, Number(mSize), true);
      mv.setUint32(22, Number(mSize), true);
      mv.setUint16(26, mNameBytes.length, true);
      mlh.set(mNameBytes, 30);

      parts.push(mlh);
      parts.push(mBytes);
      cdEntries.push({ nameBytes: mNameBytes, crc: mCrc, size: mSize, offset: currentOffset });
      currentOffset += BigInt(mlh.length) + mSize;

      // Central Directory
      const cdStartOffset = currentOffset;
      let cdTotalSize = 0n;

      for (const f of cdEntries) {
        const isOffset64 = f.offset >= 0xFFFFFFFFn;
        const extraLen = isOffset64 ? 12 : 0;
        const cd = new Uint8Array(46 + f.nameBytes.length + extraLen);
        const cv = new DataView(cd.buffer);

        cv.setUint32(0, 0x02014b50, true);
        cv.setUint16(4, 45, true);
        cv.setUint16(6, 45, true);
        cv.setUint32(16, f.crc, true);
        cv.setUint32(20, Number(f.size), true);
        cv.setUint32(24, Number(f.size), true);
        cv.setUint16(28, f.nameBytes.length, true);
        cv.setUint16(30, extraLen, true);
        cv.setUint32(42, isOffset64 ? 0xFFFFFFFF : Number(f.offset), true);
        cd.set(f.nameBytes, 46);

        if (isOffset64) {
          cv.setUint16(46 + f.nameBytes.length, 0x0001, true); // ZIP64 extra tag
          cv.setUint16(48 + f.nameBytes.length, 8, true);      // Data size
          cv.setBigUint64(50 + f.nameBytes.length, f.offset, true);
        }

        parts.push(cd);
        cdTotalSize += BigInt(cd.length);
      }

      // ZIP64 End of Central Directory Record (56 bytes)
      const zip64EOCD = new Uint8Array(56);
      const z64v = new DataView(zip64EOCD.buffer);
      z64v.setUint32(0, 0x06064b50, true);               // ZIP64 EOCD signature
      z64v.setBigUint64(4, 44n, true);                   // Size of this record
      z64v.setUint16(12, 45, true);                      // Version made by
      z64v.setUint16(14, 45, true);                      // Version needed
      z64v.setUint32(16, 0, true);                       // Disk number
      z64v.setUint32(20, 0, true);                       // Disk start
      z64v.setBigUint64(24, BigInt(cdEntries.length), true); // Number of entries on disk
      z64v.setBigUint64(32, BigInt(cdEntries.length), true); // Total entries
      z64v.setBigUint64(40, cdTotalSize, true);          // Size of central directory
      z64v.setBigUint64(48, cdStartOffset, true);        // Offset of CD with respect to start of disk
      parts.push(zip64EOCD);

      // ZIP64 End of Central Directory Locator (20 bytes)
      const zip64Locator = new Uint8Array(20);
      const locV = new DataView(zip64Locator.buffer);
      locV.setUint32(0, 0x07064b50, true);              // ZIP64 locator signature
      locV.setUint32(4, 0, true);                       // Disk number with ZIP64 EOCD
      locV.setBigUint64(8, cdStartOffset + cdTotalSize, true); // Relative offset of ZIP64 EOCD
      locV.setUint32(16, 1, true);                      // Total number of disks
      parts.push(zip64Locator);

      // Standard Legacy EOCD (22 bytes, marks 0xFFFF/0xFFFFFFFF to point parsers to ZIP64)
      const eocd = new Uint8Array(22);
      const ev = new DataView(eocd.buffer);
      ev.setUint32(0, 0x06054b50, true);
      ev.setUint16(4, 0, true);
      ev.setUint16(6, 0, true);
      ev.setUint16(8, 0xFFFF, true);                    // Signifies ZIP64
      ev.setUint16(10, 0xFFFF, true);
      ev.setUint32(12, 0xFFFFFFFF, true);
      ev.setUint32(16, 0xFFFFFFFF, true);
      parts.push(eocd);

      status.innerText = 'Finalizing ZIP64 container...';
      resultBlob = new Blob(parts, { type: 'application/zip' });
      status.innerText = `Finished (${(resultBlob.size / (1024*1024*1024)).toFixed(2)} GB)`;
      dlBtn.style.display = 'block';
    });

    dlBtn.onclick = () => {
      if (!resultBlob) return;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(resultBlob);
      a.download = `${fileName}.zip`;
      a.click();
    };
  </script>
</body>
</html>
